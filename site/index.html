<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'unsafe-inline'; img-src 'self' data: blob:; media-src blob: data:; connect-src 'self'; manifest-src 'self'; worker-src 'self' blob:; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#101411">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="color-scheme" content="dark light">
<title>PaceLab Cricket - Bowling Speed Estimator</title>
<style>
:root{
  --bg:#101411; --surface:#191F1B; --elevated:#222A24; --border:#2F3A32;
  --text:#F5F7F4; --text2:#A8B2A9; --accent:#B7F36B; --on-accent:#101411;
  --error:#FF6B6B; --warning:#FFC857; --success:#7DDC8A; --on-status:#101411;
  --focus:#B7F36B; --radius:16px; --radius-sm:10px; --shadow:0 1px 2px rgba(0,0,0,.35);
  --font:"Avenir Next LT Pro","Avenir Next",Mulish,"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  --nav-h:64px;
}
:root[data-theme="light"]{
  --bg:#F6F4FB; --surface:#FFFFFF; --elevated:#EFEBF8; --border:#D9D3EA;
  --text:#1B1B22; --text2:#5B5870; --accent:#5B3FD1; --on-accent:#FFFFFF;
  --error:#B3261E; --warning:#8A5A00; --success:#1B6E3A; --on-status:#FFFFFF;
  --focus:#5B3FD1; --shadow:0 1px 2px rgba(40,30,90,.12);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.5;
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
h1,h2,h3{line-height:1.2;margin:0 0 .5rem;font-weight:700}
h1{font-size:1.6rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:.25rem 0 .75rem}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--text2)} .small{font-size:.875rem} .center{text-align:center}
.mt{margin-top:1rem} .mb{margin-bottom:1rem} .row{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap} .grow{flex:1 1 auto}
.spread{display:flex;justify-content:space-between;align-items:center;gap:.75rem}

/* Layout */
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border);
  padding:calc(8px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;flex:1;text-decoration:none;color:var(--text)}
.brand svg{width:34px;height:34px;flex:none}
.brand .name{font-weight:800;font-size:1.15rem;letter-spacing:.2px}
.brand .name span{color:var(--accent);font-weight:600}
.icon-btn{width:48px;height:48px;border-radius:12px;border:1px solid transparent;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--text)}
.icon-btn:hover{background:var(--elevated)} .icon-btn svg{width:24px;height:24px}
main{max-width:980px;margin:0 auto;padding:16px 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom));outline:none}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--border);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.bottomnav .inner{display:flex;width:100%;max-width:980px}
.navbtn{flex:1;min-height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:none;border:none;cursor:pointer;color:var(--text2);font-size:.78rem;font-weight:600;text-decoration:none}
.navbtn svg{width:24px;height:24px}
.navbtn[aria-current="page"]{color:var(--accent)}
.navbtn[aria-current="page"] .pill{background:var(--elevated)}
.navbtn .pill{padding:2px 18px;border-radius:999px;display:grid;place-items:center}

/* Surfaces */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;background:var(--elevated)}
.grid{display:grid;gap:12px}
.grid.stats{grid-template-columns:repeat(2,1fr)}
@media(min-width:720px){.grid.stats{grid-template-columns:repeat(4,1fr)}.grid.two{grid-template-columns:1fr 1fr}}
.stat .label{color:var(--text2);font-size:.85rem;font-weight:600}
.stat .value{font-size:1.9rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:2px}
.stat .unit{font-size:.9rem;font-weight:600;color:var(--text2);margin-left:4px}
.stat .sub{color:var(--text2);font-size:.8rem}

/* Buttons */
.btn{min-height:48px;padding:0 20px;border-radius:12px;border:1px solid var(--border);background:var(--elevated);color:var(--text);
  font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed;filter:none}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.big{min-height:64px;font-size:1.15rem;width:100%;border-radius:16px}
.btn.danger{background:transparent;color:var(--error);border-color:var(--error)}
.btn.ghost{background:transparent}
.btn.small{min-height:40px;padding:0 14px;font-size:.9rem}
.btn svg{width:20px;height:20px}

/* Forms */
label.field{display:block;margin-bottom:14px}
label.field>span.l{display:block;font-weight:600;margin-bottom:4px}
.hint{color:var(--text2);font-size:.85rem;margin-top:4px}
.err-text{color:var(--error);font-size:.9rem;margin-top:4px;font-weight:600}
input[type=text],input[type=number],input[type=search],input[type=date],input[type=datetime-local],select,textarea{
  width:100%;min-height:48px;padding:10px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg);color:var(--text)}
textarea{min-height:90px;resize:vertical}
input[type=checkbox],input[type=radio]{width:22px;height:22px;accent-color:var(--accent);flex:none;margin:0}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;cursor:pointer}
.check span{flex:1}
fieldset{border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;margin:0 0 14px}
legend{font-weight:600;padding:0 6px}
input[type=range]{width:100%;height:36px;accent-color:var(--accent)}

/* Chips and status */
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-size:.82rem;font-weight:700;border:1px solid var(--border);background:var(--elevated);color:var(--text)}
.chip.q-ok{border-color:var(--success);color:var(--success)}
.chip.q-review{border-color:var(--warning);color:var(--warning)}
.chip.q-low{border-color:var(--error);color:var(--error)}
.chip.q-none{border-color:var(--text2);color:var(--text2)}
.chip.sel{background:var(--accent);color:var(--on-accent);border-color:transparent}
button.chip{cursor:pointer;min-height:40px;padding:4px 14px}
.notice{border-radius:var(--radius-sm);border:1px solid var(--border);padding:12px 14px;background:var(--elevated);display:flex;gap:10px;align-items:flex-start}
.notice.warn{border-color:var(--warning)} .notice.error{border-color:var(--error)} .notice.ok{border-color:var(--success)}
.notice .ic{font-weight:800;flex:none;width:22px;text-align:center}
.notice.warn .ic{color:var(--warning)} .notice.error .ic{color:var(--error)} .notice.ok .ic{color:var(--success)}
.banner{background:var(--elevated);border:1px dashed var(--accent);border-radius:var(--radius);padding:12px 16px}

/* Lists */
.list{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin:0;padding:0;list-style:none}
.list>li{min-width:0}
.item{min-width:0;display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;cursor:pointer;min-height:64px}
.item:hover{border-color:var(--accent)}
.item .spd{min-width:84px;font-size:1.45rem;font-weight:800;font-variant-numeric:tabular-nums}
.item .spd small{display:block;font-size:.72rem;color:var(--text2);font-weight:600}
.item .meta{flex:1;min-width:0}
.item .meta .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.kv{width:100%;border-collapse:collapse}
table.kv th,table.kv td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border);vertical-align:top;font-size:.95rem}
table.kv th{color:var(--text2);font-weight:600;width:46%}
table.kv td{font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:14px}
.tab{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--text2);font-weight:700;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent);border-color:transparent}

/* Analysis flow */
.steps{display:flex;gap:6px;margin:0 0 14px;padding:0;list-style:none}
.steps li{flex:1;text-align:center;font-size:.72rem;color:var(--text2);border-top:4px solid var(--border);padding-top:4px;font-weight:600}
.steps li.done{border-color:var(--accent);color:var(--text)} .steps li.now{border-color:var(--accent);color:var(--accent)}
.videowrap{background:#000;border-radius:var(--radius);overflow:hidden;position:relative;--arn:1.7778;aspect-ratio:var(--arn);width:100%;margin:0 auto}
@supports (width:min(1px,2px)){.videowrap{width:min(100%,calc(56vh*var(--arn)))}}
@supports (height:1dvh){.videowrap{width:min(100%,calc(56dvh*var(--arn)))}}
.videowrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:block}
.readout{display:flex;flex-wrap:wrap;gap:6px 18px;font-variant-numeric:tabular-nums;font-size:.95rem;margin:10px 0}
.readout b{color:var(--accent)}
.transport{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin:8px 0}
.seekwrap{position:relative;padding-top:18px}
.ticks{position:absolute;left:0;right:0;top:0;height:18px;pointer-events:none}
.tick{position:absolute;top:0;width:0;height:18px;border-left:3px solid var(--accent)}
.tick.end{border-color:var(--warning)}
.tick span{position:absolute;top:-2px;left:4px;font-size:.7rem;font-weight:800;color:var(--text)}
.marks{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:640px){.marks{grid-template-columns:1fr 1fr}}
.mark{border:1px solid var(--border);border-radius:var(--radius);padding:12px;background:var(--surface)}
.mark img{width:100%;max-width:200px;border-radius:8px;display:block;margin:6px 0;background:#000}
.bigresult{text-align:center;padding:22px 12px}
.bigresult .lbl{color:var(--text2);font-weight:700}
.bigresult .num{font-size:clamp(3rem,16vw,5rem);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05;color:var(--accent)}
.bigresult .num small{font-size:.35em;color:var(--text2);margin-left:6px}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* Charts */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--text2);font-size:12px;font-family:var(--font)}
.chart .axis{stroke:var(--border)} .chart .grid{stroke:var(--border);stroke-dasharray:2 3}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2.5}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .bar{fill:var(--accent)} .chart .bar.alt{fill:var(--text2)}
.chart .val{fill:var(--text);font-weight:700}

/* Overlays */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
@media(min-width:720px){.overlay{align-items:center}}
.sheet{background:var(--surface);color:var(--text);border:1px solid var(--border);width:100%;max-width:640px;max-height:92vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
@media(min-width:720px){.sheet{border-radius:20px}}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;background:var(--text);color:var(--bg);
  padding:10px 18px;border-radius:999px;font-weight:700;max-width:90vw;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.onboard-art{font-size:3rem;font-weight:800;color:var(--accent)}
.dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--border)} .dots i.on{background:var(--accent)}
details.acc{border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 14px;margin-bottom:10px;background:var(--surface)}
details.acc summary{min-height:44px;display:flex;align-items:center;font-weight:700;cursor:pointer}
.avatar{width:72px;height:72px;border-radius:50%;background:var(--elevated);display:grid;place-items:center;font-weight:800;font-size:1.6rem;color:var(--accent);overflow:hidden;border:1px solid var(--border)}
.avatar img{width:100%;height:100%;object-fit:cover}
.tips{margin:0;padding-left:1.2rem} .tips li{margin:.3rem 0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Biomechanics Analysis */
:root{--bio-knee:#B79CFF;--bio-trunk:#5FD68A;--bio-elbow:#6FB1FF;--bio-ffc:#FFB454;--bio-rel:#FF7AC6}
:root[data-theme="light"]{--bio-knee:#6A3FC8;--bio-trunk:#127234;--bio-elbow:#1D5FD0;--bio-ffc:#9C4A06;--bio-rel:#BE185D}
main.wide{max-width:1180px}
.navbtn{min-width:0} @media(max-width:420px){.navbtn .pill{padding:2px 10px}.navbtn{font-size:.72rem}}
.bio-grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media(min-width:860px){.bio-grid.two{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}}
.bio-video{position:relative;background:#000;border-radius:var(--radius-sm);overflow:hidden;--arn:1.7778;aspect-ratio:var(--arn);width:100%;margin:0 auto}
@supports (width:min(1px,2px)){.bio-video{width:min(100%,calc(62vh*var(--arn)))}}
@supports (height:1dvh){.bio-video{width:min(100%,calc(62dvh*var(--arn)))}}
.bio-video video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;display:block}
.bio-video canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.bio-video .novid{position:absolute;inset:0;display:grid;place-items:center;padding:16px;text-align:center;color:#C9D1CB;font-size:.9rem}
.bio-video.prev{margin-bottom:12px}
.bio-controls{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-top:10px}
.bio-controls .check{padding:2px 8px 2px 0;gap:6px;align-items:center}
.bio-controls select{width:auto;min-height:40px;border-radius:8px;border:1px solid var(--border);background:var(--surface);padding:0 8px}
.bio-scrub{position:relative;flex:1 1 160px;min-width:140px;height:40px;display:flex;align-items:center}
.bio-scrub input{width:100%;margin:0}
.bio-ticks{position:absolute;left:0;right:0;top:4px;height:8px;pointer-events:none}
.bio-tick{position:absolute;top:0;width:3px;height:8px;margin-left:-1px;border-radius:2px}
.readout-t{font-variant-numeric:tabular-nums;font-size:.9rem;color:var(--text2)}
.annprev{width:100%;max-height:60vh;background:#000;border-radius:var(--radius-sm)}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0 10px 12px;border-top:1px solid var(--border);border-left:4px solid var(--border);margin-top:6px}
.mrow.knee{border-left-color:var(--bio-knee)}.mrow.trunk{border-left-color:var(--bio-trunk)}.mrow.elbow{border-left-color:var(--bio-elbow)}.mrow.ffc{border-left-color:var(--bio-ffc)}.mrow.rel{border-left-color:var(--bio-rel)}
.mrow .lab{min-width:0}.mrow .lab b{display:block;font-size:.95rem}.mrow .lab span{display:block;font-size:.82rem;color:var(--text2)}
.mrow .val{font-size:1.25rem;font-weight:800;font-variant-numeric:tabular-nums;text-align:right;flex:none;max-width:48%}
.mrow .val.na{font-size:.95rem;font-weight:600;color:var(--text2)} .mrow .val.small{font-size:.95rem}
.lowc{margin-left:6px;font-size:.7rem;padding:2px 8px;vertical-align:middle}
.grid.ctx{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:6px}
.field.tight{margin:0}.check.tight{padding:4px 0}
.evtrack{position:relative;height:22px;margin:10px 6px 6px;border-radius:999px;background:var(--elevated);border:1px solid var(--border)}
.evdot{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;border:2px solid var(--surface)}
.evrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 0;border-top:1px solid var(--border)}
.evsw{width:12px;height:12px;border-radius:50%;flex:none}.evrow .lab{flex:1 1 180px;min-width:0}
.bio-charts{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media(min-width:860px){.bio-charts{grid-template-columns:repeat(3,minmax(0,1fr))}}
.bio-chart svg{width:100%;height:auto;display:block;touch-action:pan-y}
.bio-chart svg text{fill:var(--text2);font-size:11px;font-family:var(--font)}
.bio-chart svg .g{stroke:var(--border);stroke-dasharray:2 3}
.bio-chart svg #hit:focus-visible{outline:3px solid var(--focus);outline-offset:-3px}
.bio-tip{position:absolute;z-index:5;width:180px;background:var(--elevated);border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-size:.85rem;box-shadow:var(--shadow);pointer-events:none}
.bprog{height:10px;border-radius:999px;background:var(--elevated);border:1px solid var(--border);overflow:hidden;margin:8px 0}
.bprog>div{height:100%;background:var(--accent);transition:width .2s}
.dropzone{border:2px dashed var(--border);border-radius:var(--radius);padding:28px 16px;text-align:center;background:var(--surface)}
.dropzone.over{border-color:var(--accent);background:var(--elevated)}
.bio-item{align-items:flex-start;flex-wrap:wrap;cursor:default}
.bthumb{width:96px;height:64px;object-fit:cover;border-radius:8px;background:#000;flex:none}
.bthumb.ph{display:grid;place-items:center;color:var(--text2);font-size:.75rem;background:var(--elevated)}
textarea{width:100%;min-height:72px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);padding:10px}
.grid.stills{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.still{margin:0}.still img{width:100%;border-radius:8px;background:#000;display:block}
.print-only,.print-title{display:none}
@media print{
  :root,:root[data-theme="dark"]{--bg:#fff;--surface:#fff;--elevated:#f3f1f8;--border:#cfc9e3;--text:#111;--text2:#444;--accent:#5B3FD1;--bio-knee:#6A3FC8;--bio-trunk:#127234;--bio-elbow:#1D5FD0;--bio-ffc:#9C4A06;--bio-rel:#BE185D}
  body{background:#fff;color:#111;font-size:11pt}
  .topbar,.bottomnav,.no-print,#toast-root{display:none!important}
  main,main.wide{max-width:none;padding:0}
  .print-only{display:block}.print-title{display:block}
  .card{break-inside:avoid;box-shadow:none}
  .bio-charts{grid-template-columns:repeat(3,minmax(0,1fr))}
  .bio-tip{display:none!important}
}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <a class="brand" href="#/home" aria-label="PaceLab Cricket home">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="14" fill="none" stroke="var(--accent)" stroke-width="3"/><path d="M9.5 14.5c5 3 6 8 4.500 13M30.500 25.500c-5-3-6-8-4.500-13" fill="none" stroke="var(--accent)" stroke-width="2.200" stroke-linecap="round"/><path d="M2 12h7M0 20h6M2 28h7" stroke="var(--text2)" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="name">PaceLab <span>Cricket</span></span>

    const s = String(text === undefined || text === null ? '' : text).trim().replace(',', '.');
    if (s === '') return { ok: false, reason: 'DISTANCE_MISSING' };

    if (value <= 0) return { ok: false, reason: 'DISTANCE_NOT_POSITIVE' };

  const mpsToKmh = (mps) => mps * MPS_TO_KMH;
  const mpsToMph = (mps) => mps * MPS_TO_MPH;
  const toDisplaySpeed = (mps, unit) => (unit === 'mph' ? mpsToMph(mps) : mpsToKmh(mps));
  const speedUnitLabel = (unit) => (unit === 'mph' ? 'mph' : 'km/h');

    if (!isNum(mps)) return '--';

  }
  function formatDistance(metres, unit, dp) {
    if (!isNum(metres)) return '--';

    const d = i.distanceMetres;

    else if (d <= 0) reasons.push('DISTANCE_NOT_POSITIVE');

    const startMissing = i.startUs === null || i.startUs === undefined;
    const endMissing = i.endUs === null || i.endUs === undefined;
    if (startMissing) reasons.push('START_MISSING');
    else if (!isNum(i.startUs)) reasons.push('TIMESTAMP_INVALID');
    if (endMissing) reasons.push('END_MISSING');
    else if (!isNum(i.endUs)) reasons.push('TIMESTAMP_INVALID');
    if (isNum(i.startUs) && isNum(i.endUs) && i.endUs <= i.startUs) reasons.push('END_NOT_AFTER_START');

    const timing = i.timing || {};
    if (TIMESTAMP_SOURCES.indexOf(timing.source) < 0 || timing.source === 'UNKNOWN') reasons.push('TIMING_UNAVAILABLE');

    const slow = timing.slowMotion || { state: 'UNRESOLVED' };
    if (SLOW_STATES.indexOf(slow.state) < 0) reasons.push('SLOW_STATE_INVALID');
    else if (slow.state === 'USER_FACTOR' && !(isNum(slow.factor) && slow.factor >= 1)) reasons.push('SLOW_FACTOR_INVALID');

    const factor = slow.state === 'USER_FACTOR' ? slow.factor : 1;
    const mediaElapsedUs = i.endUs - i.startUs;
    const elapsedSeconds = mediaElapsedUs / 1e6 / factor;
    const speedMps = d / elapsedSeconds;
    if (!isNum(elapsedSeconds) || elapsedSeconds <= 0 || !isNum(speedMps) || speedMps <= 0) {
      return { ok: false, quality: QUALITY.INSUFFICIENT, reasons: ['NON_FINITE_RESULT'] };
    }

    let low = false;
    let review = false;

    if (timing.source === 'FRAME_PRESENTATION_TIME') flags.add('TIMESTAMPS_FROM_FRAMES');
    else { flags.add('TIMESTAMPS_FALLBACK'); low = true; }

    if (i.markersReviewed) flags.add('MARKERS_REVIEWED'); else { flags.add('MARKERS_NOT_REVIEWED'); review = true; }
    if (!i.geometryAcknowledged) { flags.add('GEOMETRY_NOT_ACKNOWLEDGED'); review = true; }
    if (timing.variableFrameRate === true) { flags.add('VARIABLE_FRAME_RATE'); review = true; }

    if (slow.state === 'UNRESOLVED') { flags.add('SLOW_MOTION_UNRESOLVED'); low = true; }
    if (slow.state === 'USER_FACTOR') { flags.add('SLOW_MOTION_USER_FACTOR'); review = true; }

    let frameIntervalsInWindow = null;
    const interval = timing.medianFrameIntervalUs;
    if (isNum(interval) && interval > 0) {

      resolutionShare = interval / mediaElapsedUs;
      if (frameIntervalsInWindow < MIN_FRAME_INTERVALS_IN_WINDOW) { flags.add('FEW_FRAMES_IN_INTERVAL'); low = true; }
    } else {
      flags.add('FRAME_INTERVAL_UNKNOWN');
      review = true;
    }

    const kmh = mpsToKmh(speedMps);
    if (kmh < TYPICAL_SPEED_KMH.min || kmh > TYPICAL_SPEED_KMH.max) { flags.add('SPEED_OUTSIDE_TYPICAL_RANGE'); review = true; }

    const quality = low ? QUALITY.LOW : review ? QUALITY.REVIEW : QUALITY.COMPLETE;
    return {
      ok: true,
      quality,
      flags: Array.from(flags),
      elapsedSeconds,
      speedMps,
      distanceMetres: d,
      resolutionShare,
      frameIntervalsInWindow,
      algorithmVersion: ALGORITHM_VERSION

  }

  /* Validation of a record before it is saved or imported. Returns an array of problems (empty = ok). */
  function validateRecord(r) {
    const p = [];
    if (!r || typeof r !== 'object') return ['RECORD_INVALID'];
    if (typeof r.id !== 'string' || !r.id) p.push('ID_MISSING');
    if (!isNum(r.distanceMetres) || r.distanceMetres <= 0) p.push('DISTANCE_INVALID');
    if (!isNum(r.startTimestampUs) || !isNum(r.endTimestampUs)) p.push('TIMESTAMP_INVALID');
    else if (r.endTimestampUs <= r.startTimestampUs) p.push('END_NOT_AFTER_START');
    if (!isNum(r.elapsedSeconds) || r.elapsedSeconds <= 0) p.push('ELAPSED_INVALID');
    if (!isNum(r.speedMps) || r.speedMps <= 0) p.push('SPEED_INVALID');
    if (SAVABLE_QUALITIES.indexOf(r.quality) < 0) p.push('QUALITY_NOT_SAVABLE');
    if (BOWLING_TYPES.indexOf(r.bowlingType) < 0) p.push('BOWLING_TYPE_INVALID');
    if (!isNum(r.createdAt)) p.push('CREATED_AT_INVALID');
    if (!isNum(r.algorithmVersion)) p.push('ALGORITHM_VERSION_MISSING');
    if (!p.length) {

      if (Math.abs(implied - r.distanceMetres) > 1e-6 * Math.max(1, r.distanceMetres)) p.push('SPEED_INCONSISTENT');
    }

  }

  /* Statistics. Eligibility: Inputs Complete and Review Recommended always; Low only when opted in.
     All maths uses unrounded canonical m/s. */
  function isEligible(d, includeLow) {
    if (!d) return false;
    if (d.quality === QUALITY.COMPLETE || d.quality === QUALITY.REVIEW) return true;
    return !!includeLow && d.quality === QUALITY.LOW;
  }
  function summarize(deliveries, includeLow) {
    const v = deliveries.filter((d) => isEligible(d, includeLow) && isNum(d.speedMps)).map((d) => d.speedMps);
    if (!v.length) return { count: 0, bestMps: null, meanMps: null, minMps: null, medianMps: null };
    let sum = 0, comp = 0; // Kahan summation
    for (const x of v) { const y = x - comp; const t = sum + y; comp = (t - sum) - y; sum = t; }
    const sorted = v.slice().sort((a, b) => a - b);
    const mid = sorted.length >> 1;
    const median = sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
    return { count: v.length, bestMps: sorted[sorted.length - 1], meanMps: sum / v.length, minMps: sorted[0], medianMps: median };
  }

    if (!values.length || !(binWidth > 0)) return [];
    const min = Math.min.apply(null, values), max = Math.max.apply(null, values);

    for (const x of values) bins[Math.min(n - 1, Math.floor((x - lo) / binWidth))].count++;

  return {
    ALGORITHM_VERSION, QUALITY, SAVABLE_QUALITIES, BOWLING_TYPES, TIMESTAMP_SOURCES, SLOW_STATES,
    MIN_FRAME_INTERVALS_IN_WINDOW, TYPICAL_SPEED_KMH, UNUSUAL_DISTANCE_M,
    toMetres, fromMetres, parseDistanceInput, mpsToKmh, mpsToMph, toDisplaySpeed, speedUnitLabel,
    formatSpeed, formatDistance, timestampDifferenceUs, evaluate, validateRecord,

})();

/*BIO-ENGINE-START*/
/* BioEngine: pure biomechanics logic for the Biomechanics Analysis feature. No DOM, no storage, no network.
   Input: pose landmark frames from a pose model (33 BlazePose landmarks per frame, normalised image coordinates).
   Everything here is a 2D, image-plane measurement from a single camera. It is not a 3D or laboratory measurement.
   All thresholds in PARAMS are provisional engineering values, not validated findings. */

  'use strict';

  const VERSION = 1;

  // BlazePose landmark indices used here. Left and right follow the person's own sides.

    L_HIP: 23, R_HIP: 24, L_KNEE: 25, R_KNEE: 26, L_ANKLE: 27, R_ANKLE: 28, L_HEEL: 29, R_HEEL: 30, L_FOOT: 31, R_FOOT: 32 };

  const KEY_LANDMARKS = [11, 12, 13, 14, 15, 16, 23, 24, 25, 26, 27, 28];

  const PARAMS = {
    minVisibility: 0.5,        // a landmark below this visibility is treated as missing
    footVisibility: 0.6,       // stricter limit for heel and toe landmarks used for foot analysis
    maxJumpTorso: 1.2,         // hip-centre jump between neighbouring samples, in torso lengths, treated as a tracking swap
    jumpResetSamples: 5,       // after this many consecutive jumps the new track is accepted
    smoothWindow: 5,           // Savitzky-Golay window (5 or 7); 0 turns smoothing off
    minValidFrames: 8,         // fewer frames with a usable pose than this cannot be analysed
    moveThreshLegPerS: 2.0,    // foot speed (leg lengths per second) that counts as moving
    stillThreshLegPerS: 0.7,   // foot speed below which the foot counts as planted
    plantLookbackS: 0.4,       // a plant must follow movement within this many seconds
    minStillSamples: 2,        // consecutive still samples needed
    plantSearchBeforeRelS: 0.35, // a plant counts only if it is this close before release (front foot) or before front foot contact (back foot)
    plantHoldToleranceS: 0.04,   // the foot must still be planted this close to the later event
    relConfidenceCap: 0.6,     // release is estimated from arm motion, never verified, so its confidence is capped
    followSettleFraction: 0.25,// follow-through ends when wrist speed stays below this fraction of its peak
    followSettleSamples: 3,
    viewSideMax: 0.55,         // shoulder width / torso length below this suggests a side view
    viewFrontMin: 0.85,        // above this suggests a front or rear view
    directionMinTorso: 0.5,    // hip travel needed (torso lengths) to trust the run-up direction
    footPitchDeg: 10,          // foot pitch beyond this is reported as heel-first or forefoot-first (likely)
    interpMaxGapFactor: 2.5,   // do not interpolate across a gap longer than this many sample intervals
    handMinRatio: 1.5,         // faster arm must exceed the other by this ratio to be called the bowling arm
    frontLegMinSepLeg: 0.15,   // minimum ankle separation (leg lengths) to call the front leg

  const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));
  const isNum = (x) => typeof x === 'number' && isFinite(x);
  function median(a) { const b = a.filter(isNum).sort((x, y) => x - y); if (!b.length) return null; const m = b.length >> 1; return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; }

  const r2 = (x) => (isNum(x) ? Math.round(x * 100) / 100 : null);

  /* A landmark in pixel units, or null when missing, non-finite or below the visibility limit. */
  function px(frame, idx, dims, minVis) {

    const x = l[0] * dims.w, y = l[1] * dims.h, v = l[3];
    if (!isNum(x) || !isNum(y) || !isNum(v) || v < (minVis === undefined ? PARAMS.minVisibility : minVis)) return null;
    return { x, y, v };
  }

  /* Included angle at B between rays BA and BC, in degrees from 0 to 180 (180 means a straight joint).
     Uses atan2(|cross|, dot), which is stable for nearly straight and nearly folded joints and needs no clamping.
     Returns null for missing points or a zero-length segment. */
  function angleAt(a, b, c) {
    if (!a || !b || !c) return null;
    const ux = a.x - b.x, uy = a.y - b.y, vx = c.x - b.x, vy = c.y - b.y;
    const nu = Math.hypot(ux, uy), nv = Math.hypot(vx, vy);

    const cross = ux * vy - uy * vx, dot = ux * vx + uy * vy;
    const ang = Math.atan2(Math.abs(cross), dot) * 180 / Math.PI;

  function mid(a, b) { return a && b ? { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, v: Math.min(a.v, b.v) } : null; }

  /* Trunk inclination: angle between the trunk line (mid-hip to mid-shoulder) and the image vertical.
     0 is upright. Positive means the shoulders are displaced toward +x of the image; multiply by the travel direction sign
     to turn it into forward lean (positive forward). */
  function trunkAngle(frame, dims) {
    const ls = px(frame, LM.L_SHOULDER, dims), rs = px(frame, LM.R_SHOULDER, dims), lh = px(frame, LM.L_HIP, dims), rh = px(frame, LM.R_HIP, dims);
    const s = mid(ls, rs), h = mid(lh, rh);

    const tx = s.x - h.x, ty = s.y - h.y;

    return { deg: Math.atan2(tx, -ty) * 180 / Math.PI, v: Math.min(s.v, h.v) };
  }

  function torsoLength(frame, dims) {
    const s = mid(px(frame, LM.L_SHOULDER, dims), px(frame, LM.R_SHOULDER, dims)), h = mid(px(frame, LM.L_HIP, dims), px(frame, LM.R_HIP, dims));
    return s && h ? Math.hypot(s.x - h.x, s.y - h.y) : null;
  }

  function sampleInterval(frames) {
    const d = []; for (let i = 1; i < frames.length; i++) { const x = frames[i].t - frames[i - 1].t; if (x > 0) d.push(x); }
    return median(d);
  }

  /* ---------- tracking clean-up ---------- */
  /* Drops samples where the tracked person jumps implausibly far between neighbouring samples, which usually means the
     pose model switched to a different person. Returns a copy. */
  function cleanFrames(frames, dims, params) {
    const P = params || PARAMS;
    const out = []; let lastHc = null, lastT = null, lastTorso = null, jumps = 0, run = 0;
    for (const f of frames) {
      if (!f.lm) { out.push({ t: f.t, lm: null }); continue; }
      const hc = mid(px(f, LM.L_HIP, dims), px(f, LM.R_HIP, dims)), torso = torsoLength(f, dims);
      if (hc && lastHc && torso && lastTorso && f.t - lastT <= 0.25) {
        const d = Math.hypot(hc.x - lastHc.x, hc.y - lastHc.y);
        if (d > P.maxJumpTorso * Math.max(torso, lastTorso)) {
          jumps++; run++;
          if (run >= P.jumpResetSamples) { run = 0; lastHc = hc; lastT = f.t; lastTorso = torso; out.push({ t: f.t, lm: f.lm.map((l) => (l ? l.slice() : l)) }); }
          else out.push({ t: f.t, lm: null, jump: true });
          continue;
        }
      }
      run = 0;
      if (hc) { lastHc = hc; lastT = f.t; lastTorso = torso || lastTorso; }
      out.push({ t: f.t, lm: f.lm.map((l) => (l ? l.slice() : l)) });
    }

  }

  /* ---------- smoothing ---------- */
  const SG = { 5: [[-3, 12, 17, 12, -3], 35], 7: [[-2, 3, 6, 7, 6, 3, -2], 21] };
  /* Savitzky-Golay smoothing (quadratic) of each landmark's x and y, applied only inside runs of consecutive visible samples.

  function smoothFrames(frames, params) {
    const P = params || PARAMS;

    if (!SG[w]) return copy;
    const [coef, den] = SG[w], half = (w - 1) / 2, medDt = sampleInterval(frames) || 0.033;
    for (let k = 0; k < 33; k++) {
      let i = 0;
      while (i < frames.length) {
        const ok = (j) => frames[j].lm && frames[j].lm[k] && isNum(frames[j].lm[k][3]) && frames[j].lm[k][3] >= P.minVisibility;
        if (!ok(i)) { i++; continue; }
        let j = i; while (j + 1 < frames.length && ok(j + 1) && frames[j + 1].t - frames[j].t <= 2.5 * medDt) j++;

            for (let q = -half; q <= half; q++) { const l = frames[m + q].lm[k]; sx += coef[q + half] * l[0]; sy += coef[q + half] * l[1]; }
            copy[m].lm[k][0] = sx / den; copy[m].lm[k][1] = sy / den;

  }

  function estimateView(frames, dims, P) {

      if (ls && rs && t) ratios.push(Math.abs(ls.x - rs.x) / t);

    if (ratio === null) return { value: 'unknown', confidence: 0, ratio: null, method: 'shoulder_width_over_torso' };
    if (ratio < P.viewSideMax) return { value: 'side', confidence: r2(clamp((P.viewSideMax - ratio) / 0.2, 0, 1)), ratio: r2(ratio), method: 'shoulder_width_over_torso' };
    if (ratio > P.viewFrontMin) {
      const face = median(noseVis) || 0;
      return { value: face >= 0.7 ? 'front' : 'rear', confidence: r2(clamp((ratio - P.viewFrontMin) / 0.3, 0, 1) * 0.5), ratio: r2(ratio), method: 'shoulder_width_over_torso' };
    }
    return { value: 'unknown', confidence: 0, ratio: r2(ratio), method: 'shoulder_width_over_torso' };
  }

  function estimateDirection(frames, dims, P) {
    const xs = [];
    frames.forEach((f, i) => { const h = mid(px(f, LM.L_HIP, dims), px(f, LM.R_HIP, dims)); if (h) xs.push({ i, x: h.x }); });
    const torso = median(frames.map((f) => torsoLength(f, dims)));
    let disp = null;
    if (xs.length >= 8 && torso) {

    img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = 160; const s = Math.min(img.width, img.height);

      const r = Store.updateProfile({ photo: c.toDataURL('image/jpeg', 0.8) }); toast(r.ok ? 'Photo saved on this device' : r.error); render(true);

    h('div', { class: 'card' },
      h('div', { class: 'row mb' }, h('div', { class: 'avatar' }, p.photo ? h('img', { src: p.photo, alt: 'Profile photo' }) : (p.displayName.trim()[0] || 'P').toUpperCase()),

function isStandalone() { return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
function installBlock() {
  const served = /^https?:$/.test(location.protocol);
  if (isStandalone()) return h('p', { class: 'muted' }, 'You are using the installed app.');
  if (deferredInstall) return h('div', null, h('p', { class: 'muted' }, 'Install PaceLab Cricket on this device so it opens like an app and works offline.'),
    h('button', { class: 'btn primary', onclick: async () => { const d = deferredInstall; deferredInstall = null; d.prompt(); try { await d.userChoice; } catch (e) { /* dismissed */ } render(true); } }, 'Install app'));
  return h('p', { class: 'muted' }, served ? 'To install: on Android Chrome open the browser menu and choose Install app or Add to Home screen. On iPhone Safari use Share, then Add to Home Screen. If no option appears, this browser may not support installing.' : 'Installing works only when the page is opened from its web address. You are viewing a local file, which still works but cannot be installed.');
}
function installCheck() {
  const ua = navigator.userAgent || '';
  const inApp = /FBAN|FBAV|Instagram|Line\/|WhatsApp|Telegram|MicroMessenger|GSA\/|; wv\)/i.test(ua);
  const ios = /iPhone|iPad|iPod/i.test(ua);
  const controlled = !!(navigator.serviceWorker && navigator.serviceWorker.controller);
  const rows = [
    ['Opened from a web address (https)', /^https:$/.test(location.protocol) ? 'Yes' : (location.protocol === 'http:' && /^(localhost|127\.)/.test(location.hostname) ? 'Local test only' : 'No')],
    ['Offline support', controlled ? 'Active' : swStatus],
    ['Browser offers an install prompt', deferredInstall ? 'Yes' : 'No'],
    ['Opened as an installed app', isStandalone() ? 'Yes' : 'No'],
    ['Browser type', inApp ? 'In-app browser (cannot install; open the address in Chrome)' : ios ? 'iPhone or iPad (use Share, then Add to Home Screen, in Safari)' : /Android/i.test(ua) ? 'Android browser' : 'Other']
  ];
  return h('details', { class: 'mt' }, h('summary', null, 'Install check (for troubleshooting)'),
    h('table', { class: 'kv small' }, h('tbody', null, rows.map((r) => h('tr', null, h('th', { scope: 'row' }, r[0]), h('td', null, r[1]))))));
}
function storageLine() {
  const span = h('span', { class: 'muted' }, 'Checking storage protection...');
  if (navigator.storage && navigator.storage.persisted) navigator.storage.persisted().then((p) => { span.textContent = p ? 'Browser storage is marked persistent, so it should not be cleared automatically when space runs low.' : 'Browser storage is not marked persistent. The browser may clear it if the device runs low on space, so export a backup now and then. Saving a delivery asks the browser for persistence.'; }).catch(() => { span.textContent = ''; });
  else span.textContent = 'This browser does not report storage protection. Export a backup now and then.';
  return span;
}

/* ---------- Settings ---------- */
function downloadText(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type })); const a = h('a', { href: url, download: name }); document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
}
Screens.settings = function (view) {
  const st = Store.get(), s = st.settings;
  const usage = h('span', { class: 'muted' }, 'Checking...');
  VideoStore.usageBytes().then((b) => { usage.textContent = b ? (b / 1048576).toFixed(1) + ' MB of video copies stored in this browser' : 'No video copies stored'; }).catch(() => { usage.textContent = 'Video storage is not available in this browser'; });

    toast(r.ok ? 'Imported ' + r.addedDeliveries + ' deliveries and ' + r.addedSessions + ' sessions' + (r.rejected ? ' (' + r.rejected + ' invalid records skipped)' : '') : r.error); render(true);

      h('label', { class: 'check' }, h('input', { type: 'checkbox', checked: s.keepVideoByDefault, onchange: (e) => { Store.updateSettings({ keepVideoByDefault: e.target.checked }); } }), h('span', null, 'Pre-select "keep a copy of the video in this browser" when saving. Off by default; videos can be large.')),
      h('div', { class: 'small' }, usage)),
    h('div', { class: 'card mb' }, h('h2', null, 'Your data'),

        h('button', { class: 'btn danger', onclick: async () => {
          const ok = await confirmDialog({ title: 'Delete all data?', body: 'This permanently deletes every delivery, session, your profile, settings and all stored video copies from this browser. It cannot be undone. Your original video files are not touched.', confirmLabel: 'Delete everything', danger: true });
          if (!ok) return; Store.wipe(); try { await VideoStore.clear(); } catch (e) { /* nothing stored */ } try { await Bio.deleteAll(); } catch (e) { /* nothing stored */ } applyTheme(); toast('All data deleted'); render(true);
        } }, 'Delete all data')),
      h('p', { class: 'hint' }, 'Exports contain measurements, sessions and profile text. They do not contain video files.')),
    h('div', { class: 'card mb' }, h('h2', null, 'Install and storage'),
      installBlock(),
      installCheck(),
      h('div', { class: 'small mt' }, storageLine())),
    h('div', { class: 'card mb' }, h('h2', null, 'Privacy'),
      h('ul', { class: 'tips' }, h('li', null, 'No account, no advertising, no analytics, no cloud service.'), h('li', null, 'This page carries a content security policy that allows it to load only its own files and bundled pose-model files from this site. It makes no connections to other websites and loads no external scripts, fonts or images.'),
        h('li', null, 'Your videos are read by your browser on your device and are never uploaded. This includes Biomechanics Analysis, where the pose model runs in your browser. Videos and tracked body landmarks are kept only inside this browser, and a video copy only if you tick "keep a copy".'),
        h('li', null, 'Sharing a result sends only the short text summary through your device\'s share function or clipboard, and only when you choose to.'))),
    h('div', { class: 'card' }, h('h2', null, 'About'), kv([['App', 'PaceLab Cricket (working name), web edition'], ['Version', APP_VERSION], ['Calculation version', String(E.ALGORITHM_VERSION)], ['Frame timestamps', Analysis.rvfc ? 'Supported by this browser' : 'Not supported by this browser'], ['Purpose', 'Training aid. Estimates only. Not a certified measuring device.']]))));

/* ---------- Help ---------- */
Screens.help = function (view) {
  const sec = (t, ...c) => h('details', { class: 'acc', open: false }, h('summary', null, t), h('div', { class: 'mb' }, c));
  view.appendChild(h('div', null, h('h1', null, 'Help and measurement guide'),
    sec('How to capture useful footage', h('ul', { class: 'tips' },
      h('li', null, 'Fix the camera on a stable surface or tripod. Do not pan, zoom or move it.'), h('li', null, 'Film from the side so both measurement positions and the ball path are in view.'),
      h('li', null, 'Use good light and a high frame rate if your phone offers it. More frames per second means finer timing.'), h('li', null, 'Avoid heavy digital zoom and stabilization modes that crop or retime the video.'))),
    sec('Why camera position matters', h('p', null, 'A single camera cannot see depth. If the ball travels toward or away from the camera, or the camera looks along the pitch, the distance you measured on the ground may not match what the picture suggests. A side-on view with the camera far enough back to show both positions clearly reduces this problem but does not remove it. This app never converts picture pixels into metres.')),
    sec('How to choose the start and end events', h('p', null, 'Pick two events you can identify exactly, for example the ball crossing line A and then line B on the ground, or passing two stumps. Use the frame buttons to move one frame at a time and set the marker on the frame where the ball is at the event. Review both marker frames before calculating.')),
    sec('How to measure the physical distance', h('p', null, 'Measure the straight distance along the ball path between the two events using a tape, or use a known length such as the distance between creases. Enter that number and its unit. It must match the interval between your two markers. The full pitch is only correct if both events are at the pitch ends. Do not use the run-up.')),
    sec('How elapsed time is calculated', h('p', null, 'When your browser supports it, the app reads the presentation timestamp of the frame shown at each marker and subtracts them. It does not assume every frame lasts the same time, so uneven frame spacing is handled. If timestamps are unavailable, the app says so and marks the result Low Measurement Quality.')),
    sec('Using the app on your phone', h('p', null, 'When this page is opened from its web address you can install it: on Android Chrome use the browser menu and choose Install app or Add to Home screen; on iPhone Safari use Share, then Add to Home Screen. Once installed it works without a connection. Record Video opens your phone camera; pick a high frame rate in the camera settings and avoid slow-motion mode for your first tests. Your results stay in that browser on that phone, so use Settings, Export data as a backup.')),
    sec('Slow-motion videos', h('p', null, 'Slow-motion files can store frames on a stretched timeline. If your video is slow motion and you know the factor (for example 240 fps capture played at 30 fps is 8x), enter it in the setup step. If you are not sure, the result is marked Low Measurement Quality because the elapsed time may be wrong by a large factor.')),
    sec('Why results are estimates', h('p', null, 'Accuracy depends on how precisely you measured the distance, which frames you marked, the frame rate, motion blur, and camera angle. The app does not show an accuracy percentage because none has been established. The quality label only reports known input limitations. It is not a measure of correctness.')),
    sec('Average speed is not peak speed', h('p', null, 'Speed is calculated as distance divided by elapsed time over your interval, so it is the average over that stretch. The ball is fastest at release and slows after bouncing, so this number is not release speed, peak speed or what a radar gun would show.')),
    sec('Worked example', h('p', null, 'Two lines are 10.0 m apart. You mark the ball at line A at 1.250 s and at line B at 1.550 s. Elapsed time is 0.300 s. Speed = 10.0 / 0.300 = 33.3 m/s. Multiply by 3.6 to get 120 km/h (or by 2.2369 for 74.5 mph). This is an illustration of the arithmetic, not a measured result.')),
    h('p', { class: 'mt' }, h('a', { class: 'btn primary', href: '#/analyze' }, 'Analyze Bowling Video'))));
};

/* ---------- Onboarding ---------- */
function showOnboarding() {
  const cards = [
    ['1', 'Import or record a bowling video', 'Choose a video from your device or record one with your camera. It never leaves your device.'],
    ['2', 'Mark two calibrated positions', 'Step to the frame where the ball is at each of two positions whose real distance apart you know.'],
    ['3', 'Review an estimated speed', 'The app divides distance by elapsed time between the two frame timestamps and shows an estimated average speed.'],
    ['4', 'Save and track progress', 'Save deliveries into sessions and watch your results over time, all stored locally.']];
  let i = 0;
  const body = h('div', { class: 'center' });
  function draw() {
    body.textContent = '';
    const c = cards[i], last = i === cards.length - 1;
    body.appendChild(h('div', { class: 'onboard-art', 'aria-hidden': 'true' }, c[0]));
    body.appendChild(h('h2', null, c[1])); body.appendChild(h('p', { class: 'muted' }, c[2]));
    if (last) body.appendChild(notice('info', 'Results are estimates. How reliable they are depends on video quality, timing, and how well you calibrate the distance.'));
    body.appendChild(h('div', { class: 'dots', 'aria-hidden': 'true' }, cards.map((_, k) => h('i', { class: k === i ? 'on' : '' }))));
    body.appendChild(h('div', { class: 'row', style: 'justify-content:space-between' }, h('button', { class: 'btn ghost', onclick: () => ref.close() }, 'Skip'), h('button', { class: 'btn primary', 'data-autofocus': '1', onclick: () => { if (last) ref.close(); else { i++; draw(); } } }, last ? 'Get started' : 'Next')));
    const f = body.querySelector('[data-autofocus]'); if (f) f.focus();
  }
  const ref = openSheet(body, { label: 'Welcome to PaceLab Cricket', onClose: () => { Store.setOnboarded(true); } });
  draw();
}

window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredInstall = e; if (parseRoute().name === 'settings') render(false); });
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { swStatus = 'Registering'; navigator.serviceWorker.register('sw.js').then(() => { swStatus = 'Registered, becomes active after a reload'; }).catch((e) => { swStatus = 'Failed: ' + ((e && e.message) || 'unknown'); console.warn('Offline support unavailable:', e && e.message); }); });
} else { swStatus = /^https?:$/.test(location.protocol) ? 'Not supported by this browser' : 'Needs a web address (not a local file)'; }
